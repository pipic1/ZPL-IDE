<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#18181b"/>
  <!-- Thermal Label shape -->
  <g transform="translate(64, 56)">
    <rect width="384" height="400" rx="16" fill="#f8fafc" stroke="#000000" stroke-width="8"/>
    <!-- Zebra header bar -->
    <rect x="24" y="24" width="336" height="32" rx="4" fill="#000000"/>
    <text x="36" y="46" fill="#ffffff" font-family="monospace" font-size="16" font-weight="900" letter-spacing="3">ZPL STUDIO PRO</text>
    
    <!-- Code 128 barcode simulation -->
    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="8" height="90" fill="#000000"/>
      <rect x="14" y="0" width="16" height="90" fill="#000000"/>
      <rect x="36" y="0" width="6" height="90" fill="#000000"/>
      <rect x="48" y="0" width="18" height="90" fill="#000000"/>
      <rect x="74" y="0" width="10" height="90" fill="#000000"/>
      <rect x="92" y="0" width="22" height="90" fill="#000000"/>
      <rect x="122" y="0" width="6" height="90" fill="#000000"/>
      <rect x="134" y="0" width="14" height="90" fill="#000000"/>
      <rect x="156" y="0" width="8" height="90" fill="#000000"/>
      <rect x="170" y="0" width="24" height="90" fill="#000000"/>
      <rect x="202" y="0" width="10" height="90" fill="#000000"/>
      <rect x="220" y="0" width="6" height="90" fill="#000000"/>
      <rect x="234" y="0" width="16" height="90" fill="#000000"/>
      <rect x="258" y="0" width="10" height="90" fill="#000000"/>
      <rect x="276" y="0" width="20" height="90" fill="#000000"/>
      <rect x="304" y="0" width="8" height="90" fill="#000000"/>
      <rect x="320" y="0" width="16" height="90" fill="#000000"/>
    </g>
    <!-- Barcode text -->
    <text x="192" y="184" text-anchor="middle" fill="#000000" font-family="monospace" font-size="14" font-weight="700">^XA^FO50,50^BC^FD1234^FS</text>
    
    <!-- Divider -->
    <line x1="24" y1="204" x2="360" y2="204" stroke="#000000" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- QR Code emblem -->
    <g transform="translate(24, 224)">
      <rect x="0" y="0" width="110" height="110" fill="none" stroke="#000000" stroke-width="6"/>
      <rect x="16" y="16" width="30" height="30" fill="#000000"/>
      <rect x="64" y="16" width="30" height="30" fill="#000000"/>
      <rect x="16" y="64" width="30" height="30" fill="#000000"/>
      <rect x="60" y="60" width="14" height="14" fill="#000000"/>
      <rect x="80" y="80" width="14" height="14" fill="#000000"/>
    </g>

    <!-- Info fields -->
    <g transform="translate(150, 230)">
      <text x="0" y="20" fill="#000000" font-family="sans-serif" font-size="20" font-weight="900">ZEBRA 203 DPI</text>
      <text x="0" y="44" fill="#52525b" font-family="monospace" font-size="13">WYSIWYG REALTIME</text>
      <rect x="0" y="60" width="180" height="40" rx="6" fill="#10b981"/>
      <text x="90" y="86" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">BIDIRECTIONAL</text>
    </g>

    <!-- Bottom notch -->
    <path d="M 172 400 L 192 384 L 212 400 Z" fill="#18181b"/>
  </g>
</svg>
